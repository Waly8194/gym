<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Routine Planner - مخطط التمرين</title>
    
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent-color: #ff5722;
            --accent-hover: #e64a19;
            --text-color: #f1f1f1;
            --text-muted: #a0a0a0;
            --border-color: #2a2a32;
            --danger-color: #e53935;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding-bottom: 50px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .main-header {
            text-align: center;
            padding: 40px 20px 20px;
            background: linear-gradient(180deg, #1f1f27 0%, var(--bg-color) 100%);
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .main-header h1 {
            font-size: 2.2rem;
            color: var(--accent-color);
            margin-bottom: 8px;
        }

        .main-header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* عداد الراحة */
        .rest-timer-section {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
            text-align: center;
        }

        .timer-display {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent-color);
            margin: 15px 0;
            font-family: monospace;
        }

        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-timer {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-timer:hover {
            border-color: var(--accent-color);
            background-color: rgba(255, 87, 34, 0.1);
        }

        .btn-stop {
            color: var(--danger-color);
            border-color: var(--danger-color);
        }

        .btn-stop:hover {
            background-color: var(--danger-color);
            color: white;
        }

        /* الأيام */
        .split-selector {
            margin-bottom: 30px;
        }

        .split-selector h2, 
        .add-exercise-section h2, 
        .workout-display h2,
        .rest-timer-section h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            border-right: 4px solid var(--accent-color);
            padding-right: 10px;
        }

        .split-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-split {
            flex: 1;
            min-width: 120px;
            padding: 12px;
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-split:hover {
            border-color: var(--accent-color);
        }

        .btn-split.active {
            background-color: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
            box-shadow: 0 4px 15px rgba(255, 87, 34, 0.3);
        }

        /* الفورم */
        .add-exercise-section {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        .form-group label {
            font-size: 0.9rem;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .form-group input, 
        .form-group select {
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }

        .form-group input:focus, 
        .form-group select:focus {
            border-color: var(--accent-color);
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
        }

        #add-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }

        #add-btn:hover {
            background-color: var(--accent-hover);
        }

        /* عرض التمارين */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-danger {
            background-color: transparent;
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .btn-danger:hover {
            background-color: var(--danger-color);
            color: white;
        }

        .exercise-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .exercise-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
        }

        .exercise-card:hover {
            transform: translateY(-3px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .card-header h3 {
            font-size: 1.1rem;
        }

        .badge {
            background-color: rgba(255, 87, 34, 0.15);
            color: var(--accent-color);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .card-body p {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .card-body p strong {
            color: var(--text-color);
        }

        .card-actions {
            margin-top: 15px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
            text-align: left;
        }

        .btn-delete {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-delete:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- الهيدر -->
    <header class="main-header">
        <h1>🏋️‍♂️ IronTracker - مخطط تمرينك</h1>
        <p>صمم جدولك، سجل أوزانك، وتابع تطورك في الجيم</p>
    </header>

    <main class="container">

        <!-- ⏱️ عداد الراحة بين المجاميع -->
        <section class="rest-timer-section">
            <h2>عداد الراحة بين المجاميع</h2>
            <div class="timer-display">
                <span id="timer-countdown">01:00</span>
            </div>
            <div class="timer-controls">
                <button class="btn-timer" onclick="startTimer(60)">راحة دقيقة (60ث)</button>
                <button class="btn-timer" onclick="startTimer(90)">راحة دقيقة ونصف (90ث)</button>
                <button class="btn-timer btn-stop" onclick="stopTimer()">إيقاف</button>
            </div>
        </section>

        <!-- اختيار يوم التمرين -->
        <section class="split-selector">
            <h2>اختر يوم التمرين:</h2>
            <div class="split-buttons">
                <button class="btn-split active" data-day="push">Push (دفع)</button>
                <button class="btn-split" data-day="pull">Pull (سحب)</button>
                <button class="btn-split" data-day="legs">Legs (أرجل)</button>
                <button class="btn-split" data-day="arms">Arms & Abs (ذراع وبطن)</button>
            </div>
        </section>

        <!-- نموذج إضافة تمرين جديد -->
        <section class="add-exercise-section">
            <h2>إضافة تمرين جديد</h2>
            <form id="exercise-form">
                <div class="form-group">
                    <label for="exercise-name">اسم التمرين:</label>
                    <input type="text" id="exercise-name" placeholder="مثال: Bench Press" required>
                </div>

                <div class="form-group">
                    <label for="muscle-group">العضلة المستهدفة:</label>
                    <select id="muscle-group">
                        <option value="chest">صدر (Chest)</option>
                        <option value="back">ظهر (Back)</option>
                        <option value="shoulders">أكتاف (Shoulders)</option>
                        <option value="biceps">بايسبس (Biceps)</option>
                        <option value="triceps">ترايسبس (Triceps)</option>
                        <option value="legs">أرجل (Legs)</option>
                        <option value="core">بطن وعضلات كور (Core)</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="weight">الوزن (كجم):</label>
                        <input type="number" id="weight" placeholder="مثال: 60" min="0" step="0.5" required>
                    </div>

                    <div class="form-group">
                        <label for="sets">المجموعات (Sets):</label>
                        <input type="number" id="sets" placeholder="مثال: 4" min="1" required>
                    </div>

                    <div class="form-group">
                        <label for="reps">العدّات (Reps):</label>
                        <input type="number" id="reps" placeholder="مثال: 10" min="1" required>
                    </div>
                </div>

                <button type="submit" id="add-btn">➕ إضافة التمرين</button>
            </form>
        </section>

        <!-- عرض التمارين المضافة -->
        <section class="workout-display">
            <div class="section-header">
                <h2>تمارين اليوم</h2>
                <button id="clear-all-btn" class="btn-danger">مسح الكل</button>
            </div>

            <div id="exercise-list" class="exercise-grid">
                <!-- التمارين ستظهر هنا تلقائياً -->
            </div>
        </section>

    </main>

    <script>
        const exerciseForm = document.getElementById('exercise-form');
        const exerciseNameInput = document.getElementById('exercise-name');
        const muscleGroupSelect = document.getElementById('muscle-group');
        const weightInput = document.getElementById('weight');
        const setsInput = document.getElementById('sets');
        const repsInput = document.getElementById('reps');
        const exerciseListContainer = document.getElementById('exercise-list');
        const splitButtons = document.querySelectorAll('.btn-split');
        const clearAllBtn = document.getElementById('clear-all-btn');

        let currentDay = 'push';

        let workouts = JSON.parse(localStorage.getItem('gymWorkouts')) || {
            push: [],
            pull: [],
            legs: [],
            arms: []
        };

        splitButtons.forEach(button => {
            button.addEventListener('click', (e) => {
                splitButtons.forEach(btn => btn.classList.remove('active'));
                e.target.classList.add('active');
                currentDay = e.target.getAttribute('data-day');
                renderExercises();
            });
        });

        exerciseForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const newExercise = {
                id: Date.now(),
                name: exerciseNameInput.value.trim(),
                muscle: muscleGroupSelect.value,
                muscleText: muscleGroupSelect.options[muscleGroupSelect.selectedIndex].text,
                weight: weightInput.value,
                sets: setsInput.value,
                reps: repsInput.value
            };

            workouts[currentDay].push(newExercise);
            saveToLocalStorage();
            renderExercises();
            exerciseForm.reset();
        });

        function renderExercises() {
            exerciseListContainer.innerHTML = '';
            const currentExercises = workouts[currentDay];

            if (currentExercises.length === 0) {
                exerciseListContainer.innerHTML = `
                    <p style="color: var(--text-muted); grid-column: 1 / -1; text-align: center; padding: 20px;">
                        لا توجد تمارين مسجلة لهذا اليوم بعد. ابدأ بإضافة أول تمرين! 🚀
                    </p>`;
                return;
            }

            currentExercises.forEach(ex => {
                const card = document.createElement('div');
                card.classList.add('exercise-card');
                
                card.innerHTML = `
                    <div class="card-header">
                        <h3>${ex.name}</h3>
                        <span class="badge">${ex.muscleText.split(' ')[0]}</span>
                    </div>
                    <div class="card-body">
                        <p><strong>الوزن:</strong> ${ex.weight} كجم</p>
                        <p><strong>المجموعات:</strong> ${ex.sets}</p>
                        <p><strong>العدّات:</strong> ${ex.reps}</p>
                    </div>
                    <div class="card-actions">
                        <button class="btn-delete" onclick="deleteExercise(${ex.id})">حذف التمرين</button>
                    </div>
                `;

                exerciseListContainer.appendChild(card);
            });
        }

        function deleteExercise(id) {
            workouts[currentDay] = workouts[currentDay].filter(ex => ex.id !== id);
            saveToLocalStorage();
            renderExercises();
        }

        clearAllBtn.addEventListener('click', () => {
            if (confirm('هل أنت متأكد من مسح جميع تمارين هذا اليوم؟')) {
                workouts[currentDay] = [];
                saveToLocalStorage();
                renderExercises();
            }
        });

        function saveToLocalStorage() {
            localStorage.setItem('gymWorkouts', JSON.stringify(workouts));
        }

        // ⏱️ عداد الراحة
        let countdown;
        const timerDisplay = document.getElementById('timer-countdown');

        function startTimer(seconds) {
            clearInterval(countdown);
            let timeLeft = seconds;
            updateTimerDisplay(timeLeft);

            countdown = setInterval(() => {
                timeLeft--;
                updateTimerDisplay(timeLeft);

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timerDisplay.textContent = "انتهت الراحة! 💪";
                    if ("vibrate" in navigator) {
                        navigator.vibrate(200);
                    }
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(countdown);
            timerDisplay.textContent = "00:00";
        }

        function updateTimerDisplay(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            const formattedMins = mins < 10 ? '0' + mins : mins;
            const formattedSecs = secs < 10 ? '0' + secs : secs;
            timerDisplay.textContent = `${formattedMins}:${formattedSecs}`;
        }

        renderExercises();
    </script>
</body>
</html>
